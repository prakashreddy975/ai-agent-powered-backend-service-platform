spring:
  application:
    name: ai-agent-powered-backend-service-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aiplatform}
    username: ${DB_USERNAME:aiplatform}
    password: ${DB_PASSWORD:aiplatform}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

claude:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${CLAUDE_MODEL:claude-opus-5-5}
  max-tokens: 16000
  timeout: 120s

integrations:
  connect-timeout: 3s
  read-timeout: 10s
  github-base-url: https://api.github.com
  deps-dev-base-url: https://api.deps.dev
  osv-base-url: https://api.osv.dev

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
