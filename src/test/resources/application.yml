# Test configuration: in-memory H2 in PostgreSQL mode, so tests need no running database.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

claude:
  # Never call the real Claude API from tests
  api-key: ""

integrations:
  connect-timeout: 1s
  read-timeout: 2s
